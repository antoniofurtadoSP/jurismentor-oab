<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JurisMentor - Professor Jurídico & Simulados OAB</title>

    <meta property="og:title" content="JurisMentor - Professor Jurídico & Simulados OAB" />
    <meta property="og:description" content="Aplicativo inteligente de preparação jurídica para Exame da OAB, Concursos Públicos e Faculdade de Direito, com simulados autênticos, cronogramas de revisão espaçada e análise de desempenho detalhada." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JurisMentor" />
  </head>
  <body style="background-color:#FAF7F2;color:#1C1917;margin:0;" class="bg-[#FAF7F2] text-stone-900 antialiased selection:bg-[#1B365D]/15 selection:text-[#1B365D]">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'Lora',Georgia,serif;background:#FAF7F2;color:#1C1917;">
        <div style="font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;color:#1B365D;letter-spacing:-0.01em;margin-bottom:8px;">JurisMentor</div>
        <div id="boot-status" style="font-size:14px;color:#57534E;">Preparando o ambiente jurídico clássico...</div>
        <button id="boot-recover" onclick="window.__jurisRecover && window.__jurisRecover()" style="display:none;margin-top:16px;padding:10px 18px;border-radius:8px;border:1px solid #1B365D;background:#1B365D;color:#FAF7F2;font-weight:600;font-size:13px;cursor:pointer;">
          Limpar Cache e Recarregar
        </button>
      </div>
    </div>
    <script>
      window.__jurisRecover = async function () {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        window.location.reload();
      };
      // If bundle fails to mount within 12s (e.g. stale mobile cache), show recovery button
      setTimeout(function () {
        var btn = document.getElementById('boot-recover');
        var st = document.getElementById('boot-status');
        if (btn && st) {
          st.textContent = 'Demorando mais que o esperado? Limpe o cache antigo do aplicativo.';
          btn.style.display = 'inline-block';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => {
            console.warn('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
