<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JurisMentor - Professor Jurídico & Simulados OAB</title>
    <meta name="description" content="Aplicativo inteligente de preparação jurídica para Exame da OAB, Concursos Públicos e Faculdade de Direito, com simulados autênticos, cronogramas de revisão espaçada e análise de desempenho detalhada." />
    <meta property="og:title" content="JurisMentor - Professor Jurídico & Simulados OAB" />
    <meta property="og:description" content="Aplicativo inteligente de preparação jurídica para Exame da OAB, Concursos Públicos e Faculdade de Direito, com simulados autênticos, cronogramas de revisão espaçada e análise de desempenho detalhada." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JurisMentor" />
  </head>
  <body style="background-color:#030712;color:#f3f4f6;margin:0;" class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,-apple-system,sans-serif;background:#030712;color:#f3f4f6;">
        <div style="font-size:20px;font-weight:700;color:#f59e0b;margin-bottom:8px;">JurisMentor</div>
        <div id="boot-status" style="font-size:14px;color:#94a3b8;">Carregando plataforma jurídica...</div>
        <button id="boot-recover" onclick="window.__jurisRecover && window.__jurisRecover()" style="display:none;margin-top:16px;padding:10px 18px;border-radius:10px;border:none;background:#f59e0b;color:#030712;font-weight:700;font-size:13px;cursor:pointer;">
          Limpar Cache e Recarregar
        </button>
      </div>
    </div>
    <script>
      window.__jurisRecover = async function () {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        window.location.reload();
      };
      // If bundle fails to mount within 12s (e.g. stale mobile cache), show recovery button
      setTimeout(function () {
        var btn = document.getElementById('boot-recover');
        var st = document.getElementById('boot-status');
        if (btn && st) {
          st.textContent = 'Demorando mais que o esperado? Limpe o cache antigo do aplicativo.';
          btn.style.display = 'inline-block';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => {
            console.warn('Falha no registro do Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
